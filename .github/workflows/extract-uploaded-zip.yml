name: Extract uploaded project ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract archive, remove ZIP, and commit everything
        shell: bash
        run: |
          set -euo pipefail
          archive="HTML-Fun-full-app-v3.zip"
          test -f "$archive"
          unzip -oq "$archive" -d .
          rm -f "$archive"
          rm -f ".github/workflows/extract-uploaded-zip.yml"

          echo "Extracted project files:"
          find . -path './.git' -prune -o -type f -print | sort

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract project archive and remove ZIP"
            git push origin HEAD:main
          else
            echo "No extracted changes found."
          fi
