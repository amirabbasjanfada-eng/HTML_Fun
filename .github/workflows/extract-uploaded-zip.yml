name: Extract uploaded ZIP

on:
  push:
    paths:
      - ".github/workflows/extract-uploaded-zip.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive and remove it
        run: |
          set -euo pipefail
          archive="HTML-Fun-full-app-v3.zip"
          test -f "$archive"
          unzip -o "$archive" -d .
          rm "$archive"
          rm ".github/workflows/extract-uploaded-zip.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract project archive and remove ZIP"
            git push
          fi
